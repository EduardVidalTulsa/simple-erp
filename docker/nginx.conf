server {
    listen 80;
    root /var/www/web;
    index index.html index.php;
    client_max_body_size 20m;

    # never serve configuration, dependencies or generated files that are not meant to be public
    location ~ /(vendor|composer\.(json|lock))  { deny all; }
    location ~ \.(lp|tex|log|aux|ps)$           { deny all; }

    # PDFs of sales documents always go through pdf/index.php: anonymous ones by uuid,
    # ones with personal data only with a signed 24 h link ($pdf_token_secret in keys.php)
    location ~* ^/pdf/[A-Za-z0-9]+\.pdf$ {
        rewrite ^/pdf/([A-Za-z0-9]+)\.pdf$ /pdf/index.php?doc=$1&pdf=1 last;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
}
